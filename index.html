<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Quest Hub</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="shared/css/style.css"></head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-amber-50 text-slate-800 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 dark:text-slate-100">
<main class="mx-auto max-w-6xl px-5 py-12"><header class="mb-10 flex items-start justify-between gap-4"><div><p class="font-bold uppercase tracking-[.25em] text-violet-600">Data Management Fundamentals</p><h1 class="mt-3 text-5xl font-black tracking-tight">Data Quest <span class="text-amber-500">🎮</span></h1><p class="mt-4 max-w-2xl text-lg text-slate-600 dark:text-slate-300">Eight short missions to turn classroom concepts into practical decisions. Pick a week and collect evidence for your portfolio.</p></div><button id="theme" class="rounded-xl border border-slate-300 px-3 py-2" aria-label="Toggle dark mode">☾</button></header>
<section id="weeks" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></section></main><script src="shared/js/audio.js"></script><script>
const weeks=[["week1-persona","01","Data Sorting Hat","Discover your data career alter ego","🎩","violet"],["week2-scraping","02","Scraping & CAPTCHA","Follow a responsible data journey","📡","sky"],["week3-keys","03","Keys & Storage","Match relationships and buckets","🧱","amber"],["week4-quality","04","Dirty Data Auditor","Spot errors and build controls","🧹","emerald"],["week5-security","05","Cloud Academy","Build a cloud base and earn detective badges","☁️","cyan"],["week6-integration","06","API Digital Waiter","Connect data silos","🔌","cyan"],["week7-analytics","07","Chart Detective","Choose honest visual stories","📊","indigo"],["week8-pitch","08","Pitch Storyboarder","Rehearse your assessment story","🚀","fuchsia"]];
document.querySelector("#weeks").innerHTML=weeks.map(w=>`<a href="${w[0]}/" class="card glass group p-6 hover:-translate-y-1 transition"><div class="flex justify-between"><span class="text-4xl">${w[4]}</span><span class="font-black text-${w[5]}-600">${w[1]}</span></div><h2 class="mt-6 text-xl font-black">${w[2]}</h2><p class="mt-2 text-sm text-slate-600 dark:text-slate-300">${w[3]}</p><span class="mt-6 inline-block font-bold text-violet-600 group-hover:translate-x-1 transition">Start mission →</span></a>`).join("");
const saved=localStorage.getItem("dq-theme"); if(saved==="dark") document.documentElement.classList.add("dark"); document.querySelector("#theme").onclick=()=>{document.documentElement.classList.toggle("dark");localStorage.setItem("dq-theme",document.documentElement.classList.contains("dark")?"dark":"light")};
</script></body></html>
