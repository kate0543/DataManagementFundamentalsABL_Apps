<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Persona Avatar Gallery | Data Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/css/style.css?v=20261009-13">
</head>
<body class="gather-page min-h-screen text-slate-800 dark:text-slate-100">
  <main class="mx-auto max-w-6xl px-5 py-8">
    <a href="./" class="font-bold text-violet-200">← Back to Data Sorting Hat</a>
    <section class="mt-6 rounded-3xl border-2 border-violet-400 bg-slate-900/90 p-7 text-white shadow-2xl">
      <p class="font-bold uppercase tracking-widest text-violet-300">Local style preview</p>
      <h1 class="mt-2 text-4xl font-black">Data career avatar gallery</h1>
      <p class="mt-3 max-w-2xl text-violet-100">These friendly emoji avatars match the style used when a student receives a persona.</p>
      <div id="gallery" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
    </section>
  </main>
  <script>
    const personas = [
      ["The Data Scientist", "🧙‍♀️", "violet"], ["The Data Analyst", "🔮", "blue"],
      ["The Data Consultant", "🧝‍♂️", "sky"], ["The Data Engineer", "🧑‍🔬", "orange"],
      ["The Cloud Engineer", "🧚‍♀️", "cyan"], ["The Database Administrator", "🧙‍♂️", "indigo"],
      ["The Data Support Specialist", "🧝‍♀️", "emerald"], ["The Cybersecurity Analyst", "🥷", "slate"],
      ["The Security Guardian", "🛡️", "rose"], ["The Data Quality Analyst", "🕵️‍♀️", "green"],
      ["The Data Architect", "👑", "amber"], ["The Product Manager", "🧚‍♂️", "fuchsia"],
    ];
    const presets = [
      ["#f6c7a5", "short", "classic"], ["#d99b72", "long", "soft"], ["#8d5524", "curly", "bold"],
      ["#f6c7a5", "long", "unique"], ["#d99b72", "short", "soft"], ["#8d5524", "curly", "classic"],
      ["#d99b72", "long", "bold"], ["#8d5524", "short", "unique"], ["#f6c7a5", "curly", "soft"],
      ["#8d5524", "long", "classic"], ["#d99b72", "curly", "bold"], ["#f6c7a5", "short", "unique"],
    ];
    const styles = {
      violet: ["#7c3aed", "#ede9fe", "#f6c7a5", "#3f2a20"], blue: ["#2563eb", "#dbeafe", "#d99b72", "#24170f"],
      sky: ["#0284c7", "#e0f2fe", "#f6c7a5", "#7c2d12"], orange: ["#ea580c", "#ffedd5", "#c9825b", "#1f2937"],
      cyan: ["#0891b2", "#cffafe", "#f6c7a5", "#164e63"], indigo: ["#4f46e5", "#e0e7ff", "#d99b72", "#111827"],
      emerald: ["#059669", "#d1fae5", "#f6c7a5", "#3f2a20"], slate: ["#475569", "#e2e8f0", "#c9825b", "#111827"],
      rose: ["#e11d48", "#ffe4e6", "#d99b72", "#3f2a20"], green: ["#16a34a", "#dcfce7", "#f6c7a5", "#422006"],
      amber: ["#d97706", "#fef3c7", "#c9825b", "#78350f"], fuchsia: ["#c026d3", "#fae8ff", "#f6c7a5", "#4a044e"],
    };
    function avatar([name, emoji, colour], index) {
      const [accent, background] = styles[colour];
      const archetypes = {"The Data Scientist":["🧙‍♀️","wizard"],"The Data Analyst":["🔮","oracle"],"The Data Consultant":["🧝‍♂️","elf guide"],"The Data Engineer":["🧑‍🔬","alchemist"],"The Cloud Engineer":["🧚‍♀️","sky fairy"],"The Database Administrator":["🧙‍♂️","rune keeper"],"The Data Support Specialist":["🧝‍♀️","healer"],"The Cybersecurity Analyst":["🥷","shadow ninja"],"The Security Guardian":["🛡️","knight"],"The Data Quality Analyst":["🕵️‍♀️","detective"],"The Data Architect":["👑","royal architect"],"The Product Manager":["🧚‍♂️","quest guide"]};
      const [icon, archetype] = archetypes[name];
      const avatarEmoji = {"wizard":"🧙‍♀️","oracle":"🔮","elf guide":"🧝‍♂️","alchemist":"🧑‍🔬","sky fairy":"🧚‍♀️","rune keeper":"🧙‍♂️","healer":"🧝‍♀️","shadow ninja":"🥷","knight":"🛡️","detective":"🕵️‍♀️","royal architect":"👑","quest guide":"🧚‍♂️"}[archetype] || "✨";
      return `<div class="persona-avatar persona-emoji" style="background:${background};border-color:${accent}" role="img" aria-label="${name} ${archetype} emoji avatar"><span class="persona-emoji-icon">${avatarEmoji}</span><span class="persona-emoji-badge">${archetype}</span></div>`;
    }
    document.querySelector("#gallery").innerHTML = personas.map((persona, index) => `<article class="rounded-2xl border border-violet-300/30 bg-white/10 p-5 text-center"><div class="mx-auto w-36">${avatar(persona, index)}</div><h2 class="mt-4 font-black">${persona[0]}</h2><p class="mt-1 text-sm text-violet-200">${persona[1]} · ${persona[2]} style</p></article>`).join("");
  </script>
</body>
</html>
